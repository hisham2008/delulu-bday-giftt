<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday! 💖</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a0b14; /* Deep, sleek dark background */
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        
        .screen {
            display: none; /* Everything is hidden by default */
        }
        
        .screen.active {
            display: block; /* Only the active screen shows */
            animation: fadeIn 1s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .emoji { 
            font-size: 80px; 
            cursor: pointer; 
            transition: transform 0.2s; 
            margin-bottom: 10px;
        }
        
        .emoji:hover { 
            transform: scale(1.1); 
        }

        .hint {
            color: #ffb3c6;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-size: 0.9rem;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }
